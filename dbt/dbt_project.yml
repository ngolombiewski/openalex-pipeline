name: openalex
version: "0.1.0"
config-version: 2

profile: openalex

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - logs
  - dbt_packages

models:
  openalex:
    staging:
      # Parse-once: staging is a native table, never a view over the external
      # table. Inherited by every model under models/staging/.
      +materialized: table
    silver:
      # Classified + projected works. Static, rebuildable corpus -> table.
      +materialized: table
    gold:
      # Question-shaped aggregates (Q1-Q3). Tiny outputs -> table, no
      # partitioning/clustering.
      +materialized: table

vars:
  # Corpus bounds — honest prod defaults (the real 1950–2026 corpus). Dev
  # overrides to the canonical dev slice — the Q3 analytical cohort and a
  # cheap structural target for Q2. Dev Q2 values do not preview prod because
  # the dev slice omits older cited works:
  #   dbt run --vars '{year_min: 2012, year_max: 2016}'
  year_min: 1950
  year_max: 2026

  # AI classification subfields (DATA_MODEL.md). Pinned by stable OpenAlex
  # subfield id, not display name. ai_strict = AI; ai_broad = AI + CV/PR.
  subfield_ai: "https://openalex.org/subfields/1702"    # Artificial Intelligence
  subfield_cv_pr: "https://openalex.org/subfields/1707" # Computer Vision and Pattern Recognition

  # Q2 citation-year snapshot bounds (docs/gold-revisit-design.md §3b).
  # Independent of publication-year bounds and advanced only after a manual
  # full-corpus refresh and prod reconciliation.
  citation_age_year_min: 2012
  citation_age_year_max: 2025

  # Q3 age-controlled publication cohort. Same bounds as the canonical dev
  # slice.
  gini_cohort_min: 2012
  gini_cohort_max: 2016

  # 2026 extraction is in-flight; Q1 flags the year so the dashboard can dim it.
  partial_year: 2026
