<circle cx="750.4" cy="208.9" r="5" fill="#7259b5" stroke="#fcfcfb" stroke-width="2"/>
<text x="760.4" y="195.9" fill="#0b0b0b" font-size="12" font-weight="500" text-anchor="start">Information Systems</text>
<text x="760.4" y="210.9" fill="#6f6e6a" font-size="11" text-anchor="start">62% uncited · 0.729 Gini</text>
<circle cx="215.6" cy="318.7" r="4" fill="#8b8a86" stroke="#fcfcfb" stroke-width="2"/>
<text x="205.6" y="305.7" fill="#0b0b0b" font-size="12" font-weight="500" text-anchor="end">Signal processing</text>
<circle cx="718.4" cy="403.7" r="4" fill="#8b8a86" stroke="#fcfcfb" stroke-width="2"/>
<text x="708.4" y="423.7" fill="#0b0b0b" font-size="12" font-weight="500" text-anchor="end">Software</text>
</svg>
