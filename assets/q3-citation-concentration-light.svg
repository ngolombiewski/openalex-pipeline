<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Citation reach and inequality across 2020 computer science subfields</title>
<desc id="desc">Scatter plot of the share of papers uncited after five complete years against citation inequality among cited papers. Artificial Intelligence and Computer Vision combine low uncited shares with high cited-only Gini coefficients.</desc>
<rect width="960" height="560" fill="#fcfcfb"/>
<text x="78" y="31" fill="#0b0b0b" font-size="19" font-weight="600">Citation reach and inequality move independently</text>
<text x="78" y="53" fill="#52514e" font-size="13">2020 computer science subfields · citations received in years 1–5 after publication</text>
<line x1="78" y1="432.0" x2="918" y2="432.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="67" y="436.0" fill="#6f6e6a" font-size="12" text-anchor="end">0.64</text>
<line x1="78" y1="332.0" x2="918" y2="332.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="67" y="336.0" fill="#6f6e6a" font-size="12" text-anchor="end">0.68</text>
<line x1="78" y1="232.0" x2="918" y2="232.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="67" y="236.0" fill="#6f6e6a" font-size="12" text-anchor="end">0.72</text>
<line x1="78" y1="132.0" x2="918" y2="132.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="67" y="136.0" fill="#6f6e6a" font-size="12" text-anchor="end">0.76</text>
<line x1="78" y1="482" x2="918" y2="482" stroke="#c8c7c2" stroke-width="1"/>
<text x="144.3" y="504" fill="#6f6e6a" font-size="12" text-anchor="middle">35%</text>
<text x="365.4" y="504" fill="#6f6e6a" font-size="12" text-anchor="middle">45%</text>
<text x="586.4" y="504" fill="#6f6e6a" font-size="12" text-anchor="middle">55%</text>
<text x="807.5" y="504" fill="#6f6e6a" font-size="12" text-anchor="middle">65%</text>
<text x="498.0" y="532" fill="#52514e" font-size="13" text-anchor="middle">Share uncited after five years</text>
<text x="78" y="551" fill="#6f6e6a" font-size="12">← more papers reached</text>
<text x="20" y="282.0" fill="#52514e" font-size="13" text-anchor="middle" transform="rotate(-90 20 282.0)">Cited-only Gini · winnings more concentrated ↑</text>
<circle cx="395.4" cy="132.7" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="405.4" y="119.7" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">Artificial Intelligence</text>
<text x="405.4" y="134.7" fill="#6f6e6a" font-size="11" text-anchor="start">46% uncited · 0.760 Gini</text>
<circle cx="475.1" cy="181.9" r="4" fill="#8b8a86" stroke="#fcfcfb" stroke-width="2"/>
<text x="485.1" y="169.9" fill="#0b0b0b" font-size="12" font-weight="500" text-anchor="start">Theory &amp; mathematics</text>
<circle cx="862.4" cy="133.9" r="5" fill="#7259b5" stroke="#fcfcfb" stroke-width="2"/>
<text x="852.4" y="120.9" fill="#0b0b0b" font-size="12" font-weight="500" text-anchor="end">Computer Graphics</text>
<text x="852.4" y="135.9" fill="#6f6e6a" font-size="11" text-anchor="end">67% uncited · 0.759 Gini</text>
<circle cx="472.1" cy="288.3" r="4" fill="#8b8a86" stroke="#fcfcfb" stroke-width="2"/>
<text x="482.1" y="307.3" fill="#0b0b0b" font-size="12" font-weight="500" text-anchor="start">Networks</text>
<circle cx="702.2" cy="234.1" r="4" fill="#8b8a86" stroke="#fcfcfb" stroke-width="2"/>
<text x="692.2" y="254.1" fill="#0b0b0b" font-size="12" font-weight="500" text-anchor="end">CS applications</text>
<circle cx="149.9" cy="155.2" r="6" fill="#e45e2b" stroke="#fcfcfb" stroke-width="2"/>
<text x="159.9" y="142.2" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">Computer Vision / PR</text>
<text x="159.9" y="157.2" fill="#6f6e6a" font-size="11" text-anchor="start">35% uncited · 0.751 Gini</text>
<circle cx="415.3" cy="433.8" r="4" fill="#8b8a86" stroke="#fcfcfb" stroke-width="2"/>
<text x="425.3" y="453.8" fill="#0b0b0b" font-size="12" font-weight="500" text-anchor="start">Hardware</text>
